<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área Admin - Global Truck</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #1f2937;
      border-radius: 15px;
      padding: 25px;
      margin-top: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,.3);
    }

    h1, h2 {
      margin-top: 0;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      margin-bottom: 15px;
      border: 1px solid #374151;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    label {
      font-weight: bold;
      display: block;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      opacity: .9;
    }

    .btn-danger {
      background: #dc2626;
    }

    .btn-secondary {
      background: #374151;
    }

    .hidden {
      display: none !important;
    }

    .erro {
      color: #f87171;
      margin-top: 15px;
      font-weight: bold;
    }

    .sucesso {
      color: #4ade80;
      margin-top: 15px;
      font-weight: bold;
    }

    .carga {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 18px;
      margin-top: 15px;
    }

    .carga strong {
      color: #4ade80;
    }

    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .topo button {
      width: auto;
      padding: 10px 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginArea" class="card">

    <h1>🔐 Área Administrativa</h1>

    <p>Digite a senha de administrador para continuar.</p>

    <label for="senha">Senha</label>
    <input
      type="password"
      id="senha"
      placeholder="Digite sua senha"
      autocomplete="current-password"
    >

    <button id="btnLogin">
      ENTRAR
    </button>

    <div id="loginMensagem"></div>

  </div>


  <!-- PAINEL ADMIN -->
  <div id="painelArea" class="hidden">

    <div class="card">

      <div class="topo">
        <h1>🚛 Painel de Cargas</h1>

        <button
          id="btnSair"
          class="btn-secondary"
        >
          Sair
        </button>
      </div>

      <hr>

      <h2>Nova carga</h2>

      <form id="formCarga">

        <label for="carga">Carga *</label>
        <input
          type="text"
          id="carga"
          placeholder="Ex: Soja, milho, madeira..."
        >

        <label for="valor">Valor da carga *</label>
        <input
          type="number"
          id="valor"
          placeholder="Ex: 15000"
          step="0.01"
        >

        <label for="local_coleta">Local onde pegar a carga *</label>
        <input
          type="text"
          id="local_coleta"
          placeholder="Ex: Porto Alegre"
        >

        <label for="local_entrega">Local onde entregar *</label>
        <input
          type="text"
          id="local_entrega"
          placeholder="Ex: São Paulo"
        >

        <label for="placa">Placa do caminhão *</label>
        <input
          type="text"
          id="placa"
          placeholder="Ex: ABC1D23"
        >

        <label for="motorista">Nome do motorista *</label>
        <input
          type="text"
          id="motorista"
          placeholder="Nome do motorista"
        >

        <label for="data_carga">Data da carga</label>
        <input
          type="date"
          id="data_carga"
        >

        <label for="status">Status</label>
        <select id="status">
          <option value="Disponível">Disponível</option>
          <option value="Em andamento">Em andamento</option>
          <option value="Entregue">Entregue</option>
        </select>

        <label for="observacao">Observação</label>
        <textarea
          id="observacao"
          placeholder="Alguma informação adicional..."
        ></textarea>

        <button type="submit">
          CRIAR CARGA
        </button>

      </form>

      <div id="mensagem"></div>

    </div>


    <!-- LISTA -->
    <div class="card">

      <h2>Cargas cadastradas</h2>

      <div id="listaCargas">
        Carregando...
      </div>

    </div>

  </div>

</div>


<script>

  const loginArea = document.getElementById("loginArea");
  const painelArea = document.getElementById("painelArea");

  const senhaInput = document.getElementById("senha");
  const btnLogin = document.getElementById("btnLogin");
  const btnSair = document.getElementById("btnSair");

  const loginMensagem =
    document.getElementById("loginMensagem");

  const mensagem =
    document.getElementById("mensagem");

  const formCarga =
    document.getElementById("formCarga");

  const listaCargas =
    document.getElementById("listaCargas");


  // NÃO ENTRA AUTOMATICAMENTE NO PAINEL
  // O usuário sempre precisa informar a senha.

  function mostrarLogin() {

    loginArea.classList.remove("hidden");
    painelArea.classList.add("hidden");

    senhaInput.value = "";
    senhaInput.focus();
  }


  function mostrarPainel() {

    loginArea.classList.add("hidden");
    painelArea.classList.remove("hidden");

    carregarCargas();
  }


  // LOGIN
  async function fazerLogin() {

    const senha = senhaInput.value.trim();

    if (!senha) {

      loginMensagem.innerHTML =
        '<div class="erro">Digite a senha.</div>';

      return;
    }

    btnLogin.disabled = true;
    btnLogin.innerText = "ENTRANDO...";

    try {

      const resposta = await fetch("/api/login", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          password: senha
        })

      });

      const dados = await resposta.json();

      if (!resposta.ok) {

        loginMensagem.innerHTML =
          '<div class="erro">' +
          (dados.error || "Senha incorreta.") +
          '</div>';

        return;
      }

      if (!dados.token) {

        loginMensagem.innerHTML =
          '<div class="erro">Servidor não retornou o token.</div>';

        return;
      }

      localStorage.setItem(
        "admin_token",
        dados.token
      );

      loginMensagem.innerHTML = "";

      mostrarPainel();

    } catch (erro) {

      console.error(erro);

      loginMensagem.innerHTML =
        '<div class="erro">Erro ao conectar ao servidor.</div>';

    } finally {

      btnLogin.disabled = false;
      btnLogin.innerText = "ENTRAR";

    }
  }


  btnLogin.addEventListener(
    "click",
    fazerLogin
  );


  senhaInput.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        fazerLogin();
      }

    }
  );


  // SAIR
  btnSair.addEventListener(
    "click",
    function() {

      localStorage.removeItem("admin_token");

      mostrarLogin();

    }
  );


  // CRIAR CARGA
  formCarga.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      mensagem.innerHTML = "";

      const carga =
        document.getElementById("carga").value.trim();

      const valor =
        document.getElementById("valor").value;

      const local_coleta =
        document.getElementById("local_coleta").value.trim();

      const local_entrega =
        document.getElementById("local_entrega").value.trim();

      const placa =
        document.getElementById("placa").value.trim();

      const motorista =
        document.getElementById("motorista").value.trim();

      const data_carga =
        document.getElementById("data_carga").value;

      const status =
        document.getElementById("status").value;

      const observacao =
        document.getElementById("observacao").value.trim();


      if (!carga) {

        mensagem.innerHTML =
          '<div class="erro">Preencha o campo Carga.</div>';

        return;
      }

      if (!valor) {

        mensagem.innerHTML =
          '<div class="erro">Preencha o Valor da carga.</div>';

        return;
      }

      if (!local_coleta) {

        mensagem.innerHTML =
          '<div class="erro">Preencha o Local onde pegar a carga.</div>';

        return;
      }

      if (!local_entrega) {

        mensagem.innerHTML =
          '<div class="erro">Preencha o Local onde entregar.</div>';

        return;
      }

      if (!placa) {

        mensagem.innerHTML =
          '<div class="erro">Preencha a Placa do caminhão.</div>';

        return;
      }

      if (!motorista) {

        mensagem.innerHTML =
          '<div class="erro">Preencha o Nome do motorista.</div>';

        return;
      }


      const token =
        localStorage.getItem("admin_token");

      if (!token) {

        mostrarLogin();

        return;
      }


      try {

        const resposta = await fetch(
          "/api/cargas",
          {

            method: "POST",

            headers: {

              "Content-Type": "application/json",

              "Authorization":
                "Bearer " + token

            },

            body: JSON.stringify({

              carga: carga,

              valor: Number(valor),

              local_coleta:
                local_coleta,

              local_entrega:
                local_entrega,

              placa:
                placa,

              motorista:
                motorista,

              data_carga:
                data_carga || null,

              status:
                status,

              observacao:
                observacao

            })

          }
        );


        const dados =
          await resposta.json();


        if (!resposta.ok) {

          if (
            resposta.status === 401 ||
            resposta.status === 403
          ) {

            localStorage.removeItem(
              "admin_token"
            );

            mostrarLogin();

            loginMensagem.innerHTML =
              '<div class="erro">Sua sessão expirou. Digite a senha novamente.</div>';

            return;
          }

          mensagem.innerHTML =
            '<div class="erro">' +
            (dados.error || "Erro ao criar carga.") +
            '</div>';

          return;
        }


        mensagem.innerHTML =
          '<div class="sucesso">Carga criada com sucesso!</div>';


        formCarga.reset();

        carregarCargas();

      } catch (erro) {

        console.error(erro);

        mensagem.innerHTML =
          '<div class="erro">Erro ao conectar ao servidor.</div>';

      }

    }
  );


  // CARREGAR CARGAS
  async function carregarCargas() {

    try {

      const resposta =
        await fetch("/api/cargas");

      const cargas =
        await resposta.json();


      if (!Array.isArray(cargas) || cargas.length === 0) {

        listaCargas.innerHTML =
          "<p>Nenhuma carga cadastrada.</p>";

        return;
      }


      listaCargas.innerHTML =
        cargas.map(function(carga) {

          return `

            <div class="carga">

              <strong>${escapar(carga.carga)}</strong>

              <p>
                💰 Valor:
                R$ ${Number(carga.valor || 0).toFixed(2)}
              </p>

              <p>
                📍 Coleta:
                ${escapar(carga.local_coleta)}
              </p>

              <p>
                🏁 Entrega:
                ${escapar(carga.local_entrega)}
              </p>

              <p>
                🚛 Placa:
                ${escapar(carga.placa)}
              </p>

              <p>
                👤 Motorista:
                ${escapar(carga.motorista)}
              </p>

              <p>
                📅 Data:
                ${carga.data_carga || "Não informada"}
              </p>

              <p>
                📌 Status:
                ${escapar(carga.status)}
              </p>

              ${
                carga.observacao
                ? `<p>📝 ${escapar(carga.observacao)}</p>`
                : ""
              }

              <button
                class="btn-danger"
                onclick="excluirCarga(${carga.id})"
              >
                EXCLUIR CARGA
              </button>

            </div>

          `;

        }).join("");


    } catch (erro) {

      console.error(erro);

      listaCargas.innerHTML =
        '<div class="erro">Erro ao carregar cargas.</div>';

    }

  }


  // EXCLUIR
  async function excluirCarga(id) {

    if (!confirm("Deseja realmente excluir esta carga?")) {
      return;
    }


    const token =
      localStorage.getItem("admin_token");


    if (!token) {

      mostrarLogin();

      return;
    }


    try {

      const resposta =
        await fetch(
          "/api/cargas/" + id,
          {

            method: "DELETE",

            headers: {

              "Authorization":
                "Bearer " + token

            }

          }
        );


      const dados =
        await resposta.json();


      if (!resposta.ok) {

        if (
          resposta.status === 401 ||
          resposta.status === 403
        ) {

          localStorage.removeItem(
            "admin_token"
          );

          mostrarLogin();

          return;
        }

        alert(
          dados.error ||
          "Erro ao excluir carga."
        );

        return;
      }


      carregarCargas();


    } catch (erro) {

      console.error(erro);

      alert(
        "Erro ao conectar ao servidor."
      );

    }

  }


  // PROTEÇÃO CONTRA HTML
  function escapar(valor) {

    if (valor === null || valor === undefined) {
      return "";
    }

    return String(valor)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // COMEÇA SEMPRE NA TELA DE LOGIN
  mostrarLogin();

</script>

</body>
</html>
