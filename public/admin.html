<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administração - Global Truck</title>
  <link rel="stylesheet" href="/style.css">

  <style>
    .admin-container {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px;
    }

    .painel {
      background: #111820;
      border: 1px solid #26313d;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .painel h2 {
      margin-bottom: 20px;
      color: #00aaff;
    }

    .campo {
      margin-bottom: 15px;
    }

    .campo label {
      display: block;
      color: #9aa7b5;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .campo input,
    .campo select,
    .campo textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #26313d;
      border-radius: 8px;
      background: #0b0f14;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .campo textarea {
      min-height: 90px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .acoes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .btn-excluir {
      background: #b3261e;
    }

    .btn-sair {
      background: #444d57;
    }

    .login {
      max-width: 400px;
      margin: 60px auto;
      padding: 20px;
      background: #111820;
      border: 1px solid #26313d;
      border-radius: 12px;
    }

    .login h2 {
      margin-bottom: 20px;
      color: #00aaff;
    }

    .mensagem {
      margin-top: 12px;
      color: #62e58b;
      font-size: 14px;
    }

    .erro {
      color: #ff7777;
    }

    .carga {
      margin-bottom: 15px;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

</head>

<body>

<header>
  <div>
    <h1>GLOBAL TRUCK</h1>
    <p>Administração de Cargas</p>
  </div>

<a href="/" class="admin-btn">Voltar</a>

</header>

<main class="admin-container">

  <!-- LOGIN -->

  <div id="loginArea" class="login">

```
<h2>Área Administrativa</h2>

<div class="campo">
  <label>Senha</label>

  <input
    type="password"
    id="senha"
    placeholder="Digite sua senha"
  >
</div>

<button onclick="entrar()">
  Entrar
</button>

<div id="loginMensagem" class="mensagem"></div>
```

  </div>

  <!-- ÁREA ADMIN -->

  <div id="adminArea" style="display:none;">

```
<div class="painel">

  <h2>Nova Carga</h2>

  <div class="grid">

    <div class="campo">
      <label>Carga</label>

      <input
        type="text"
        id="carga"
        placeholder="Ex: Soja"
      >
    </div>


    <div class="campo">
      <label>Valor</label>

      <input
        type="number"
        id="valor"
        step="0.01"
        inputmode="decimal"
        placeholder="Ex: 5000"
      >
    </div>


    <div class="campo">
      <label>Local para pegar a carga</label>

      <input
        type="text"
        id="local_coleta"
        placeholder="Ex: Porto Alegre"
      >
    </div>


    <div class="campo">
      <label>Local de entrega</label>

      <input
        type="text"
        id="local_entrega"
        placeholder="Ex: São Paulo"
      >
    </div>


    <div class="campo">
      <label>Placa do caminhão</label>

      <input
        type="text"
        id="placa"
        placeholder="Ex: ABC1D23"
      >
    </div>


    <div class="campo">
      <label>Nome do motorista</label>

      <input
        type="text"
        id="motorista"
        placeholder="Nome do motorista"
      >
    </div>


    <div class="campo">
      <label>Data da carga</label>

      <input
        type="date"
        id="data_carga"
      >
    </div>


    <div class="campo">
      <label>Status</label>

      <select id="status">

        <option value="Disponível">
          Disponível
        </option>

        <option value="Em andamento">
          Em andamento
        </option>

        <option value="Entregue">
          Entregue
        </option>

      </select>

    </div>

  </div>


  <div class="campo">

    <label>Observação</label>

    <textarea
      id="observacao"
      placeholder="Alguma informação sobre a carga..."
    ></textarea>

  </div>


  <div class="acoes">

    <button onclick="criarCarga()">
      Criar carga
    </button>

    <button
      onclick="limparFormulario()"
      class="btn-sair"
    >
      Limpar
    </button>

    <button
      onclick="sair()"
      class="btn-sair"
    >
      Sair
    </button>

  </div>


  <div id="mensagem" class="mensagem"></div>

</div>


<!-- LISTA -->

<div class="painel">

  <h2>Cargas cadastradas</h2>

  <div id="listaAdmin">
    Carregando...
  </div>

</div>
```

  </div>

</main>

<script>

let token = localStorage.getItem("adminToken");


/* =========================
   INICIAR
========================= */

if (token) {
  mostrarAdmin();
}


/* =========================
   LOGIN
========================= */

async function entrar() {

  const senha =
    document.getElementById("senha").value.trim();

  const mensagem =
    document.getElementById("loginMensagem");

  mensagem.className = "mensagem";
  mensagem.textContent = "Entrando...";


  if (!senha) {

    mensagem.className = "mensagem erro";
    mensagem.textContent =
      "Digite sua senha.";

    return;
  }


  try {

    const resposta = await fetch(
      "/api/login",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          senha: senha
        })
      }
    );


    const dados =
      await resposta.json();


    if (!resposta.ok) {

      mensagem.className = "mensagem erro";

      mensagem.textContent =
        dados.erro || "Senha incorreta.";

      return;
    }


    localStorage.setItem(
      "adminToken",
      dados.token
    );


    token = dados.token;

    mostrarAdmin();

  } catch (erro) {

    console.error(erro);

    mensagem.className = "mensagem erro";

    mensagem.textContent =
      "Erro ao conectar ao servidor.";
  }
}


/* =========================
   MOSTRAR ADMIN
========================= */

function mostrarAdmin() {

  document.getElementById(
    "loginArea"
  ).style.display = "none";


  document.getElementById(
    "adminArea"
  ).style.display = "block";


  carregarAdmin();
}


/* =========================
   CRIAR CARGA
========================= */

async function criarCarga() {

  const mensagem =
    document.getElementById("mensagem");

  mensagem.className = "mensagem";
  mensagem.textContent = "Verificando dados...";


  const carga =
    document.getElementById("carga").value.trim();

  const valor =
    document.getElementById("valor").value.trim();

  const localColeta =
    document.getElementById("local_coleta").value.trim();

  const localEntrega =
    document.getElementById("local_entrega").value.trim();

  const placa =
    document.getElementById("placa").value.trim();

  const motorista =
    document.getElementById("motorista").value.trim();

  const dataCarga =
    document.getElementById("data_carga").value;

  const observacao =
    document.getElementById("observacao").value.trim();

  const status =
    document.getElementById("status").value;


  /* VERIFICAÇÕES */

  if (!carga) {

    mostrarErro(
      "Preencha o campo Carga."
    );

    return;
  }


  if (!valor) {

    mostrarErro(
      "Preencha o campo Valor."
    );

    return;
  }


  if (!localColeta) {

    mostrarErro(
      "Preencha o local onde pegará a carga."
    );

    return;
  }


  if (!localEntrega) {

    mostrarErro(
      "Preencha o local de entrega."
    );

    return;
  }


  if (!placa) {

    mostrarErro(
      "Preencha a placa do caminhão."
    );

    return;
  }


  if (!motorista) {

    mostrarErro(
      "Preencha o nome do motorista."
    );

    return;
  }


  if (!token) {

    mostrarErro(
      "Você não está conectado como administrador."
    );

    return;
  }


  const dados = {

    carga: carga,

    valor: Number(
      valor.replace(",", ".")
    ),

    local_coleta: localColeta,

    local_entrega: localEntrega,

    placa: placa,

    motorista: motorista,

    data_carga:
      dataCarga || null,

    observacao:
      observacao,

    status:
      status || "Disponível"
  };


  mensagem.textContent =
    "Salvando carga...";


  try {

    const resposta =
      await fetch(
        "/api/cargas",
        {
          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + token
          },

          body:
            JSON.stringify(dados)
        }
      );


    const resultado =
      await resposta.json();


    if (resposta.status === 401) {

      localStorage.removeItem(
        "adminToken"
      );

      token = null;

      document.getElementById(
        "loginArea"
      ).style.display = "block";

      document.getElementById(
        "adminArea"
      ).style.display = "none";

      mostrarErroLogin(
        "Sua sessão expirou. Entre novamente."
      );

      return;
    }


    if (!resposta.ok) {

      mostrarErro(
        resultado.erro ||
        "Erro ao criar carga."
      );

      return;
    }


    mensagem.className =
      "mensagem";

    mensagem.textContent =
      "Carga criada com sucesso!";


    limparFormulario();


    await carregarAdmin();

  } catch (erro) {

    console.error(erro);

    mostrarErro(
      "Erro ao conectar ao servidor."
    );
  }
}


/* =========================
   CARREGAR CARGAS
========================= */

async function carregarAdmin() {

  const lista =
    document.getElementById(
      "listaAdmin"
    );


  lista.innerHTML =
    "<p>Carregando cargas...</p>";


  try {

    const resposta =
      await fetch(
        "/api/cargas"
      );


    if (!resposta.ok) {

      lista.innerHTML =
        "<p>Erro ao carregar cargas.</p>";

      return;
    }


    const cargas =
      await resposta.json();


    if (!cargas.length) {

      lista.innerHTML =
        "<p>Nenhuma carga cadastrada.</p>";

      return;
    }


    lista.innerHTML =
      cargas.map(
        carga => `

        <div class="carga">

          <h3>
            ${escapar(carga.carga)}
          </h3>

          <div class="info">

            <div>
              <span>Valor</span>
              R$ ${Number(
                carga.valor
              ).toFixed(2)}
            </div>

            <div>
              <span>Motorista</span>
              ${escapar(
                carga.motorista
              )}
            </div>

            <div>
              <span>Placa</span>
              ${escapar(
                carga.placa
              )}
            </div>

            <div>
              <span>Coleta</span>
              ${escapar(
                carga.local_coleta
              )}
            </div>

            <div>
              <span>Entrega</span>
              ${escapar(
                carga.local_entrega
              )}
            </div>

            <div>
              <span>Status</span>
              ${escapar(
                carga.status
              )}
            </div>

          </div>

          <div class="acoes">

            <button
              class="btn-excluir"
              onclick="excluirCarga(${carga.id})"
            >
              Excluir
            </button>

          </div>

        </div>
      `
      ).join("");

  } catch (erro) {

    console.error(erro);

    lista.innerHTML =
      "<p>Erro ao carregar cargas.</p>";
  }
}


/* =========================
   EXCLUIR
========================= */

async function excluirCarga(id) {

  const confirmar =
    confirm(
      "Deseja realmente excluir esta carga?"
    );


  if (!confirmar) {
    return;
  }


  try {

    const resposta =
      await fetch(
        "/api/cargas/" + id,
        {
          method: "DELETE",

          headers: {
            "Authorization":
              "Bearer " + token
          }
        }
      );


    if (resposta.status === 401) {

      sair();

      return;
    }


    if (!resposta.ok) {

      alert(
        "Não foi possível excluir a carga."
      );

      return;
    }


    carregarAdmin();

  } catch (erro) {

    console.error(erro);

    alert(
      "Erro ao conectar ao servidor."
    );
  }
}


/* =========================
   LIMPAR FORMULÁRIO
========================= */

function limparFormulario() {

  document.getElementById(
    "carga"
  ).value = "";

  document.getElementById(
    "valor"
  ).value = "";

  document.getElementById(
    "local_coleta"
  ).value = "";

  document.getElementById(
    "local_entrega"
  ).value = "";

  document.getElementById(
    "placa"
  ).value = "";

  document.getElementById(
    "motorista"
  ).value = "";

  document.getElementById(
    "data_carga"
  ).value = "";

  document.getElementById(
    "observacao"
  ).value = "";

  document.getElementById(
    "status"
  ).value = "Disponível";
}


/* =========================
   SAIR
========================= */

function sair() {

  localStorage.removeItem(
    "adminToken"
  );

  token = null;


  document.getElementById(
    "loginArea"
  ).style.display = "block";


  document.getElementById(
    "adminArea"
  ).style.display = "none";


  document.getElementById(
    "senha"
  ).value = "";
}


/* =========================
   ERROS
========================= */

function mostrarErro(texto) {

  const mensagem =
    document.getElementById(
      "mensagem"
    );

  mensagem.className =
    "mensagem erro";

  mensagem.textContent =
    texto;
}


function mostrarErroLogin(texto) {

  const mensagem =
    document.getElementById(
      "loginMensagem"
    );

  mensagem.className =
    "mensagem erro";

  mensagem.textContent =
    texto;
}


/* =========================
   SEGURANÇA
========================= */

function escapar(texto) {

  if (
    texto === null ||
    texto === undefined
  ) {
    return "";
  }


  return String(texto)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}

</script>

</body>
</html>
